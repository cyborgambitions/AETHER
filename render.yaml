# AETHER — Render Blueprint
# Deploy: Dashboard → New → Blueprint → connect github.com/cyborgambitions/AETHER
# Or: New Web Service → this repo → Root Directory = backend

services:
  - type: web
    name: aether-first-principles
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: data/aether.db
      - key: DEFAULT_MODEL
        value: grok-4.3
      - key: CORS_ORIGINS
        value: "*"
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.8"
