# AETHER on Render.com
# Deploy as Web Service

services:
  - type: web
    name: aether-first-principles
    env: python
    region: oregon   # or frankfurt, etc.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: XAI_API_KEY
        sync: false   # Set this in Render dashboard (for hosted pro mode)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: DEFAULT_MODEL
        value: grok-3
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: /var/data/aether.db
      - key: FRONTEND_URL
        sync: false   # Set to your deployed https://...onrender.com after first deploy for Stripe redirects
    # Persistent disk for SQLite (Render provisions on create if declared)
    disk:
      name: aether-data
      mountPath: /var/data
      sizeGB: 1
