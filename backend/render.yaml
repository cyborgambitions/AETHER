# AETHER on Render.com
# Use when Root Directory is set to `backend` in the dashboard.
# Prefer the root-level render.yaml Blueprint for one-click deploys.

services:
  - type: web
    name: aether-first-principles
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: XAI_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: data/aether.db
      - key: FRONTEND_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: DEFAULT_MODEL
        value: grok-4.5
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.8"
